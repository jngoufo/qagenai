site_name: ISTQB GenAI Certification... Made Easy
site_url: https://qagenai.monwebmestre.tech/
site_author: Monwebmestre
site_description: A condensed course to prepare for the ISTQB GenAI certification exam.

# Configuration du Thème
theme:
  name: material
  logo: assets/Monwebmestre-logo-512.jpg
  favicon: assets/Monwebmestre-fav-64.png
  language: en # Langue par défaut (Anglais)
  palette: 
    - scheme: default
      primary: custom
      accent: custom
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.suggest
    - search.highlight
    - navigation.top
    - navigation.footer

  icon:
    admonition:
      example: fontawesome/solid/utensils
      info: fontawesome/solid/graduation-cap
      failure: fontawesome/solid/fire
    repo: fontawesome/brands/github

# Configuration CSS Personnalisée
extra_css:
  - assets/extra.css

# Configuration des Extensions Markdown
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list

# -------------------------------------------------------------------------
# CONFIGURATION SUPPLÉMENTAIRE (Social, Analytics, Cookies)
# -------------------------------------------------------------------------
extra:
  generator: false  # Désactive la mention "Made with Material..."
  
  # Liens sociaux
  social:
    - icon: fontawesome/solid/mug-hot
      link: https://ko-fi.com/monwebmestre 
      name: Buy me a Coffee
    - icon: fontawesome/solid/envelope
      link: mailto:justin@monwebmestre.tech
      name: Contact / Feedback
  
  # Google Analytics
  analytics:
    provider: google
    property: G-YL6KVB3K9Z
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: Yes, it was great!
          data: 1
          note: >-
            Thanks! Feel free to buy me a coffee.
        - icon: material/emoticon-sad-outline
          name: No, not really
          data: 0
          note: >-
            I'm sorry. Please send me feedback via email!

  # Bannière Cookies (Version par défaut : ANGLAIS)
  consent:
    title: Cookie Consent
    description: >- 
      I use cookies to analyze traffic and improve content.
      No personal data is collected. Do you accept anonymous tracking?
    actions:
      - accept
      - reject
      - manage

# -------------------------------------------------------------------------
# MENU DE NAVIGATION (Version par défaut : ANGLAIS)
# -------------------------------------------------------------------------
nav:
  - 'Home': index.md
  - 'Chapter 1':
      - 'Introduction & Roadmap': chapter1/introduction.md  
      - '1.1 Foundations & Concepts': chapter1/1.1-foundations.md
      - '1.2 Leveraging Generative AI': chapter1/1.2-leveraging-genai.md
      - '🧪 Practice Lab': chapter1/exercises.md
  - 'Chapter 2':
      - 'Introduction & Roadmap': chapter2/introduction.md
      - '2.1 Effective Prompt Development': chapter2/2.1-effective-prompting.md
      - '2.2 Applying Prompt Techniques': chapter2/2.2-applying-prompt-techniques.md
      - '2.3 Evaluate Results & Refine': chapter2/2.3-evaluate-refine-prompt.md
      - '🧪 Practice Lab': chapter2/exercises.md
  - 'Chapter 3':
      - 'Introduction & Roadmap': chapter3/introduction.md
      - '3.1 Hallucinations, Reasoning errors & Biases': chapter3/3.1-hallucinations-bias.md
      - '3.2 Data Privacy and Security Risks': chapter3/3.2-privacy-security.md
      - '3.3 Environmental Impact and Regulations': chapter3/3.3-sustainability-regulation.md
      - '🧪 Practice Lab': chapter3/exercises.md 
  - 'Chapter 4':
      - 'Introduction & Roadmap': chapter4/introduction.md
      - '4.1 RAG & Agents': chapter4/4.1-architecture-rag-agents.md
      - '4.2 Fine-Tuning & LLMOps': chapter4/4.2-finetuning-llmops.md
      - '🧪 Practice Lab': chapter4/exercises.md
  - 'Chapter 5':
        - 'Introduction & Roadmap': chapter5/introduction.md
        - '5.1 Adoption of Generative AI': chapter5/5.1-roadmap-strategy.md
        - '5.2 Change Management': chapter5/5.2-change-management.md
        - '🧪 Practice Lab': chapter5/exercises.md
